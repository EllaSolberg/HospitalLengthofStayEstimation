<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Prediksjon med Modellen</title>
</head>
<body>
    <h1>Prediksjon med Modellen</h1>
    <form action="/predict" method="POST">
        <label for="feature1">Funksjon 1:</label>
        <input type="number" id="feature1" name="feature1" required><br>

        <label for="feature2">Funksjon 2:</label>
        <input type="number" id="feature2" name="feature2" required><br>

        <!-- Legg til flere felter hvis modellen din bruker flere funksjoner -->

        <button type="submit">Forutsi</button>
    </form>

    <h2>{{ prediction_text }}</h2>
</body>
</html>
